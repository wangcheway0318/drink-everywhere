<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧋 Drink Everywhere</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;
  --accent:#f7c948;--accent2:#ff7b54;--accent3:#7ee8a2;
  --text:#f0f0f0;--text2:#9a9db0;--border:rgba(255,255,255,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif;}

/* ═══ MOBILE ═══ */
#mobile-app{display:none;position:relative;width:100vw;height:100vh;height:100dvh;overflow:hidden;}
#map{position:absolute;inset:0;width:100%;height:100%;}

#m-header{
  position:absolute;top:0;left:0;right:0;z-index:50;
  padding:env(safe-area-inset-top,12px) 12px 10px;
  padding-top:max(env(safe-area-inset-top,0px),12px);
  background:linear-gradient(to bottom,rgba(15,17,23,0.97) 80%,transparent);
  pointer-events:none;
  box-sizing:border-box;
  width:100%;
}
#m-header>*{pointer-events:all;}
#m-top-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;width:100%;}
#m-logo{font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;color:var(--accent);white-space:nowrap;flex-shrink:0;}
#m-search-wrap{flex:1;position:relative;min-width:0;}
#m-si{
  width:100%;background:rgba(26,29,39,.95);border:1px solid var(--border);
  border-radius:11px;padding:9px 36px 9px 12px;color:var(--text);font-size:14px;
  font-family:'Noto Sans TC',sans-serif;outline:none;box-sizing:border-box;
}
#m-si::placeholder{color:var(--text2);}
#m-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text2);font-size:16px;cursor:pointer;display:none;padding:2px 4px;}
#m-suggestions{
  position:absolute;top:calc(100% + 4px);left:0;right:0;
  background:rgba(22,25,36,.98);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;z-index:200;display:none;
  max-height:200px;overflow-y:auto;
}
.m-sug-item{padding:10px 14px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.m-sug-item:last-child{border-bottom:none;}
.m-sug-item:active{background:var(--surface2);}
.m-sug-icon{font-size:14px;flex-shrink:0;}
.m-btn{width:38px;height:38px;border-radius:11px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:transform .15s;}
.m-btn:active{transform:scale(.88);}
.m-btn-s{background:rgba(247,201,72,.92);color:#000;}
.m-btn-l{background:rgba(255,123,84,.92);color:#fff;}
#m-radius-row{display:flex;align-items:center;gap:9px;background:rgba(26,29,39,.9);border-radius:10px;padding:7px 12px;border:1px solid var(--border);width:100%;}
#m-radius-row label{font-size:11px;color:var(--text2);white-space:nowrap;}
#m-radius-slider{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--surface2);outline:none;}
#m-radius-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
#m-radius-val{font-size:12px;font-weight:700;color:var(--accent);min-width:38px;text-align:right;}

/* bubble panel */
#bubble-panel{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:40;transition:transform .3s ease;}
#bubble-panel.hidden{transform:translateY(-50%) translateX(148px);}
#bubble-tab{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:26px;height:54px;background:rgba(26,29,39,.9);border-radius:10px 0 0 10px;border:1px solid var(--border);border-right:none;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;color:var(--accent);}
#bubble-box{width:148px;background:rgba(26,29,39,.9);border:1px solid var(--border);border-radius:14px 0 0 14px;padding:10px 8px;}
#bubble-title{font-size:10px;color:var(--text2);font-weight:700;text-align:center;margin-bottom:7px;letter-spacing:1px;text-transform:uppercase;}
#m-bsvg{width:132px;height:220px;display:block;}

/* list panel */
#list-panel{position:absolute;bottom:0;left:0;right:0;z-index:40;transition:transform .32s cubic-bezier(.4,0,.2,1);}
#list-panel.hidden{transform:translateY(calc(100% - 50px));}
#list-handle{background:rgba(22,25,38,.95);border:1px solid var(--border);border-bottom:none;border-radius:18px 18px 0 0;padding:11px 16px 8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;height:50px;}
#list-knob{width:36px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);}
#list-label{font-size:13px;font-weight:700;color:var(--accent);}
#list-chevron{font-size:11px;color:var(--text2);transition:transform .3s;}
#list-panel:not(.hidden) #list-chevron{transform:rotate(180deg);}
#list-scroll{background:rgba(22,25,38,.97);border:1px solid var(--border);border-top:none;overflow-y:auto;max-height:55vh;}

/* ═══ DESKTOP ═══ */
#desktop-app{display:none;flex-direction:column;height:100vh;overflow:hidden;}
#d-header{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:14px;flex-shrink:0;flex-wrap:wrap;}
#d-logo{font-family:'Outfit',sans-serif;font-size:21px;font-weight:800;color:var(--accent);white-space:nowrap;}
#d-search-group{display:flex;gap:7px;flex:1;min-width:260px;}
#d-search-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:var(--text);font-size:14px;font-family:'Noto Sans TC',sans-serif;outline:none;transition:border-color .2s;}
#d-search-input:focus{border-color:var(--accent);}
#d-search-input::placeholder{color:var(--text2);}
.d-sug-item{padding:10px 16px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.d-sug-item:last-child{border-bottom:none;}
.d-sug-item:hover{background:var(--surface2);}
.d-btn{padding:9px 14px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;white-space:nowrap;transition:transform .15s;}
.d-btn:active{transform:scale(.95);}
.d-btn-s{background:var(--accent);color:#000;}
.d-btn-l{background:var(--accent2);color:#fff;}
#d-rg{display:flex;align-items:center;gap:8px;margin-left:auto;}
#d-rg label{font-size:12px;color:var(--text2);white-space:nowrap;}
#d-radius-slider{width:110px;-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:var(--surface2);outline:none;}
#d-radius-slider::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--accent);cursor:pointer;border:2px solid var(--bg);}
#d-rv{font-size:12px;font-weight:700;color:var(--accent);min-width:40px;}
#d-body{display:flex;flex:1;overflow:hidden;}
#d-map-wrap{flex:1;position:relative;}
#d-map{width:100%;height:100%;}
#d-sidebar{width:340px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
#d-tabs{display:flex;border-bottom:1px solid var(--border);}
.d-tab{flex:1;padding:11px 6px;text-align:center;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:3px solid transparent;transition:color .2s,border-color .2s;}
.d-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.d-panel{flex:1;overflow-y:auto;display:none;}
.d-panel.active{display:block;}
#d-list-info{padding:9px 16px;font-size:12px;color:var(--text2);border-bottom:1px solid var(--border);}
#d-list-info strong{color:var(--accent);}
#d-bwrap{padding:14px;}
#d-bwrap h3{font-size:14px;font-weight:700;margin-bottom:3px;}
#d-bwrap p{font-size:11px;color:var(--text2);margin-bottom:10px;}
#d-bsvg{width:100%;display:block;}

/* shared store items */
.si{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;}
.si:active,.si:hover{background:var(--surface2);}
.sico{width:42px;height:42px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--surface2);}
.sinf{flex:1;min-width:0;}
.snm{font-size:14px;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sad{font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.stags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:600;}
.td{background:rgba(126,232,162,.15);color:var(--accent3);}
.tr{background:rgba(247,201,72,.15);color:var(--accent);}
.to{background:rgba(126,232,162,.15);color:var(--accent3);}
.tc{background:rgba(255,100,80,.15);color:#ff7b7b;}
.empty{padding:40px 20px;text-align:center;color:var(--text2);font-size:13px;}
.empty-i{font-size:38px;margin-bottom:10px;}

/* loading */
#map-loading,#d-map-loading{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:200;}
.spinner{width:36px;height:36px;border:3px solid var(--surface2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ═══ DETAIL SHEET ═══ */
#detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:500;display:none;align-items:flex-end;}
#detail-overlay.open{display:flex;}
#detail-sheet{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,12px);animation:su .3s cubic-bezier(.34,1.2,.64,1);position:relative;}
@keyframes su{from{transform:translateY(100%);}to{transform:translateY(0);}}
#sh-knob{width:38px;height:4px;background:var(--border);border-radius:4px;margin:11px auto 0;}
#sh-hdr{padding:14px 20px;border-bottom:1px solid var(--border);}
#sh-name{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;}
#sh-addr{font-size:12px;color:var(--text2);margin-top:3px;}
#sh-meta{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;}
.mb{padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;}
.mb-r{background:rgba(247,201,72,.15);color:var(--accent);}
.mb-o{background:rgba(126,232,162,.15);color:var(--accent3);}
.mb-c{background:rgba(255,100,80,.15);color:#ff7b7b;}
.mb-p{background:rgba(255,123,84,.15);color:var(--accent2);cursor:pointer;}
/* ── detail layout ── */
#sh-body{display:flex;gap:0;border-bottom:1px solid var(--border);}
#sh-hours{padding:14px 20px;flex:1;min-width:0;border-right:1px solid var(--border);}
#sh-hours h3{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
.hr{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}
.hr-t{color:var(--accent);font-weight:700;}
#sh-menu-panel{padding:14px 16px;flex:1;min-width:0;}
#sh-menu-panel h3{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;}
#sh-menu-imgs{display:flex;flex-direction:column;gap:8px;}
#sh-menu-imgs img{width:100%;border-radius:10px;object-fit:cover;max-height:140px;background:var(--surface2);}
.menu-img-label{font-size:11px;color:var(--text2);text-align:center;margin-top:2px;}
#sh-acts{display:flex;gap:8px;padding:11px 20px;border-bottom:1px solid var(--border);}
.ab{flex:1;padding:12px 4px;border-radius:12px;border:none;cursor:pointer;font-size:13px;font-weight:700;font-family:'Noto Sans TC',sans-serif;transition:transform .15s;}
.ab:active{transform:scale(.94);}
.ab-n{background:var(--accent);color:#000;}
.ab-o{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
/* legacy - keep for mobile */
.ab-m{background:var(--accent2);color:#fff;}
#sh-menu{display:none;}
#sh-order{padding:11px 20px;display:none;}
#sh-order h3{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:9px;text-transform:uppercase;letter-spacing:1px;}
#otbl{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:9px;}
#otbl th{background:var(--surface2);padding:7px 3px;text-align:center;font-size:10px;color:var(--text2);}
#otbl td{padding:5px 3px;border-bottom:1px solid var(--border);text-align:center;}
.oi{width:100%;background:transparent;border:none;color:var(--text);font-size:11px;text-align:center;outline:none;font-family:'Noto Sans TC',sans-serif;}
.oi::placeholder{color:var(--surface2);}
select.oi{background:var(--surface2);border-radius:5px;padding:2px;cursor:pointer;}
.osub{color:var(--accent);font-weight:600;}
.del-r{background:none;border:none;color:#ff7b7b;cursor:pointer;font-size:14px;padding:2px 5px;}
#ord-ft{display:flex;align-items:center;justify-content:space-between;gap:8px;}
#add-row{padding:7px 13px;border-radius:9px;border:1px dashed var(--border);background:none;color:var(--text2);cursor:pointer;font-size:12px;font-family:'Noto Sans TC',sans-serif;}
#total-d{font-size:15px;font-weight:700;color:var(--accent);}
#close-sh{position:absolute;right:13px;top:13px;width:27px;height:27px;border-radius:50%;background:var(--surface2);border:none;color:var(--text2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
::-webkit-scrollbar{width:3px;}
::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px;}
</style>
</head>
<body>

<!-- MOBILE -->
<div id="mobile-app">
  <div id="map-loading"><div class="spinner"></div><p style="color:var(--text2);font-size:13px">載入地圖中…</p></div>
  <div id="map"></div>
  <div id="m-header">
    <div id="m-top-row">
      <span id="m-logo">🧋 Drink Everywhere</span>
      <div id="m-search-wrap">
        <input id="m-si" type="text" placeholder="搜尋地址、地點名稱…" autocomplete="off">
        <button id="m-clear">✕</button>
        <div id="m-suggestions"></div>
      </div>
      <button class="m-btn m-btn-s" id="m-sb">🔍</button>
      <button class="m-btn m-btn-l" id="m-lb">📍</button>
    </div>
    <div id="m-radius-row">
      <label>搜尋半徑</label>
      <input type="range" id="m-rs" min="0.5" max="5" step="0.5" value="1.5">
      <span id="m-rv">1.5 km</span>
    </div>
  </div>
  <div id="bubble-panel" class="hidden">
    <div id="bubble-tab">🫧</div>
    <div id="bubble-box">
      <div id="bubble-title">品牌分佈</div>
      <svg id="m-bsvg" viewBox="0 0 132 220"></svg>
    </div>
  </div>
  <div id="list-panel" class="hidden">
    <div id="list-handle">
      <span id="list-label">🧋 找到 0 間飲料店</span>
      <div id="list-knob"></div>
      <span id="list-chevron">▲</span>
    </div>
    <div id="list-scroll"></div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop-app">
  <div id="d-header">
    <span id="d-logo">🧋 Drink Everywhere</span>
    <div id="d-search-group">
      <div style="position:relative;flex:1;">
        <input id="d-si" type="text" placeholder="搜尋地址、地點名稱、店名…" autocomplete="off" style="width:100%;">
        <div id="d-suggestions" style="position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;z-index:200;display:none;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.4);"></div>
      </div>
      <button class="d-btn d-btn-s" id="d-sb">🔍 搜尋</button>
      <button class="d-btn d-btn-l" id="d-lb">📍 定位</button>
    </div>
    <div id="d-rg">
      <label>搜尋半徑</label>
      <input type="range" id="d-rs" min="0.5" max="5" step="0.5" value="1.5">
      <span id="d-rv">1.5 km</span>
    </div>
  </div>
  <div id="d-body">
    <div id="d-map-wrap">
      <div id="d-map-loading"><div class="spinner"></div><p style="color:var(--text2);font-size:13px">載入地圖中…</p></div>
      <div id="d-map"></div>
    </div>
    <div id="d-sidebar">
      <div id="d-tabs">
        <div class="d-tab active" data-tab="list">📋 店家清單</div>
        <div class="d-tab" data-tab="bubbles">🫧 品牌分佈</div>
      </div>
      <div id="d-panel-list" class="d-panel active">
        <div id="d-list-info">找到 <strong id="d-cnt">0</strong> 間飲料店</div>
        <div id="d-list-items"></div>
      </div>
      <div id="d-panel-bubbles" class="d-panel">
        <div id="d-bwrap">
          <h3>品牌分佈圖</h3>
          <p>圓圈越大 = 附近分店越多</p>
          <svg id="d-bsvg" viewBox="0 0 300 300"></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- DETAIL SHEET -->
<div id="detail-overlay">
  <div id="detail-sheet">
    <div id="sh-knob"></div>
    <button id="close-sh">✕</button>
    <div id="sh-hdr">
      <div id="sh-name"></div>
      <div id="sh-addr"></div>
      <div id="sh-meta"></div>
    </div>
    <div id="sh-body">
      <div id="sh-hours"><h3>🕐 營業時間</h3><div id="sh-hrs"></div></div>
      <div id="sh-menu-panel">
        <h3>🧋 菜單照片</h3>
        <div id="sh-menu-imgs"><p style="color:var(--text2);font-size:12px">點選店家後自動載入…</p></div>
      </div>
    </div>
    <div id="sh-acts">
      <button class="ab ab-n" id="btn-nav">🗺 導航</button>
      <button class="ab ab-o" id="btn-order">📝 點餐</button>
    </div>
    <div id="sh-menu" style="display:none"></div>
    <div id="sh-order">
      <h3>點餐清單</h3>
      <table id="otbl">
        <thead><tr><th>姓名</th><th>飲品</th><th>甜度</th><th>冰量</th><th>數量</th><th>單價</th><th>小計</th><th></th></tr></thead>
        <tbody id="otbody"></tbody>
      </table>
      <div id="ord-ft">
        <button id="add-row">＋ 新增列</button>
        <div id="total-d">總計：NT$0</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ── CONFIG ── */
const GKEY = 'AIzaSyD4mQnWzB7GgIGLgk0onr5npWwEE4W_J0E';
const IS_MOB = window.innerWidth < 768 || /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
document.getElementById(IS_MOB ? 'mobile-app' : 'desktop-app').style.display = IS_MOB ? 'block' : 'flex';


/* ── BRAND DATA ── */
const BC = {'50嵐':'#00b4d8','春水堂':'#7ec8e3','茶湯會':'#2196f3','清心福全':'#ffc107',
  '一芳':'#ff9800','珍煮丹':'#f44336','迷客夏':'#4caf50','鶴茶樓':'#9c27b0',
  'CoCo':'#ff5722','大苑子':'#ff7043','翰林':'#009688','麻古':'#ffeb3b',
  '日出茶太':'#ff6f00','天仁':'#1565c0','老虎':'#d32f2f'};
const BE = {'50嵐':'🧊','春水堂':'🍵','茶湯會':'☕','清心':'🌻','一芳':'🍓',
  '珍煮丹':'🔴','迷客夏':'🟢','鶴茶':'🦢','CoCo':'🟠','大苑':'🍊',
  '翰林':'🌿','麻古':'🟡','日出':'🌅','天仁':'🔵','老虎':'🐯'};
function bClr(n){for(const[k,v]of Object.entries(BC))if(n.includes(k))return v;return`hsl(${[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%360},60%,55%)`;}
function bEmj(n){for(const[k,v]of Object.entries(BE))if(n.includes(k))return v;return'🧋';}
function bKey(n){for(const k of Object.keys(BC))if(n.includes(k))return k;return n.replace(/第?\d+|號|分店|店$/g,'').trim().slice(0,5);}

/* ── STATE ── */
let mMap,dMap,mSvc,dSvc,mCircle,dCircle;
let stores=[],mMkrs=[],dMkrs=[];
let searchCenter=null;
let curPlace=null,menuOpen=false,orderOpen=false;
let bubVis=false,listVis=false;

function gMap(){return IS_MOB?mMap:dMap;}
function gSvc(){return IS_MOB?mSvc:dSvc;}
function gRad(){return parseFloat(document.getElementById(IS_MOB?'m-rs':'d-rs').value);}

/* ── INIT MAP (Google callback) ── */
function initMap(){
  const ctr={lat:24.1477,lng:120.6536};
  const sty=mapStyle();
  if(IS_MOB){
    document.getElementById('map-loading').style.display='none';
    mMap=new google.maps.Map(document.getElementById('map'),{center:ctr,zoom:15,styles:sty,disableDefaultUI:true,gestureHandling:'greedy'});
    mSvc=new google.maps.places.PlacesService(mMap);
  } else {
    document.getElementById('d-map-loading').style.display='none';
    dMap=new google.maps.Map(document.getElementById('d-map'),{center:ctr,zoom:15,styles:sty,disableDefaultUI:true,gestureHandling:'greedy',zoomControl:true,zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_BOTTOM}});
    dSvc=new google.maps.places.PlacesService(dMap);
  }
  locateMe();
  initAutocomplete();
}

/* ── LOCATE ── */
function locateMe(){
  if(!navigator.geolocation){alert('瀏覽器不支援定位');return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const ll={lat:pos.coords.latitude,lng:pos.coords.longitude};
      searchCenter=new google.maps.LatLng(ll.lat,ll.lng);
      gMap().setCenter(searchCenter);
      addMeMarker(searchCenter);
      searchFrom(searchCenter);
    },
    err=>{
      console.warn('Geolocation error:',err.code,err.message);
      searchCenter=gMap().getCenter();
      searchFrom(searchCenter);
    },
    {timeout:10000,enableHighAccuracy:true}
  );
}

function addMeMarker(pos){
  new google.maps.Marker({position:pos,map:gMap(),zIndex:999,title:'您的位置',
    icon:{path:google.maps.SymbolPath.CIRCLE,scale:10,fillColor:'#f7c948',fillOpacity:1,strokeColor:'#fff',strokeWeight:3}});
}

/* ── HELPERS ── */
function toLL(c){
  if(c instanceof google.maps.LatLng) return c;
  return new google.maps.LatLng(typeof c.lat==='function'?c.lat():c.lat, typeof c.lng==='function'?c.lng():c.lng);
}

function drawCircle(ll,r){
  const opts={center:ll,radius:r,strokeColor:'#ff4444',strokeOpacity:.9,strokeWeight:2,fillColor:'#ff4444',fillOpacity:.07};
  if(IS_MOB){if(mCircle)mCircle.setMap(null);mCircle=new google.maps.Circle({map:mMap,...opts});}
  else{if(dCircle)dCircle.setMap(null);dCircle=new google.maps.Circle({map:dMap,...opts});}
}

function fitToRadius(ll,r){
  const m=gMap();
  m.setCenter(ll);
  const bounds=new google.maps.LatLngBounds();
  [0,90,180,270].forEach(h=>bounds.extend(google.maps.geometry.spherical.computeOffset(ll,r*1.25,h)));
  m.fitBounds(bounds,{top:IS_MOB?115:20,right:20,bottom:IS_MOB?60:20,left:20});
  // Re-apply center after fitBounds settles
  setTimeout(()=>m.setCenter(ll),80);
}

/* ── SEARCH (Places API - nearbySearch) ── */
function searchFrom(center){
  const ll = toLL(center);
  searchCenter = ll;
  const r = gRad()*1000;

  drawCircle(ll,r);
  fitToRadius(ll,r);

  mMkrs.forEach(m=>m.setMap(null)); mMkrs=[];
  dMkrs.forEach(m=>m.setMap(null)); dMkrs=[];
  stores=[];

  document.getElementById('list-label').textContent='🔍 搜尋中…';
  document.getElementById('d-cnt').textContent='…';

  const svc = gSvc();
  const kwds = ['手搖飲料', '珍珠奶茶', 'bubble tea', '飲料店', '茶飲'];
  let done = 0;
  let anyDenied = false;

  kwds.forEach(kw => {
    svc.nearbySearch(
      { location: ll, radius: r, keyword: kw },
      (results, status) => {
        const S = google.maps.places.PlacesServiceStatus;
        console.log('[nearbySearch]', kw, status, results?.length ?? 0);

        if (status === S.OK && results) {
          results.forEach(p => {
            if (!stores.find(s => s.place_id === p.place_id)) {
              stores.push(p);
              addMkr(p);
            }
          });
        } else if (status === S.REQUEST_DENIED) {
          anyDenied = true;
        }

        if (++done >= kwds.length) {
          if (anyDenied) {
            showErr('⛔ API Key 被拒絕\n請至 Google Cloud Console 確認 Places API 已啟用，並檢查 API Key 的 HTTP 參照網址限制是否包含此網站網址');
          }
          sortStores(ll);
          renderList();
          renderBubbles();
        }
      }
    );
  });
}

/* ── MARKERS ── */
function makeBobaIcon(name){
  const color=bClr(name);
  const label=name.replace(/第?\d+|號|分店$/g,'').trim().slice(0,6);
  const w=Math.max(56,label.length*9+18);
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='50'>
    <defs><filter id='s'><feDropShadow dx='0' dy='1' stdDeviation='1.5' flood-color='rgba(0,0,0,.55)'/></filter></defs>
    <rect x='1' y='1' width='${w-2}' height='21' rx='10' fill='${color}' filter='url(#s)'/>
    <text x='${w/2}' y='13' text-anchor='middle' dominant-baseline='middle' font-family='Noto Sans TC,sans-serif' font-size='10' font-weight='700' fill='#fff'>${label}</text>
    <text x='${w/2}' y='38' text-anchor='middle' dominant-baseline='middle' font-size='19'>🧋</text>
  </svg>`;
  return{url:'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg),scaledSize:new google.maps.Size(w,50),anchor:new google.maps.Point(w/2,50)};
}

function addMkr(p){
  const m=new google.maps.Marker({position:p.geometry.location,map:gMap(),title:p.name,icon:makeBobaIcon(p.name),zIndex:10});
  m.addListener('click',()=>openDetail(p));
  if(IS_MOB)mMkrs.push(m); else dMkrs.push(m);
}

/* ── SORT ── */
function sortStores(ll){
  stores.forEach(s=>{s._d=google.maps.geometry.spherical.computeDistanceBetween(ll,s.geometry.location);});
  stores.sort((a,b)=>a._d-b._d);
}
function fD(m){return m<1000?Math.round(m)+'m':(m/1000).toFixed(1)+'km';}

/* ── RENDER BUBBLES ── */
function renderBubbles(){
  const bmap={};
  stores.forEach(s=>{const k=bKey(s.name);if(!bmap[k])bmap[k]={count:0,color:bClr(s.name)};bmap[k].count++;});
  const brands=Object.entries(bmap).map(([k,v])=>({name:k,...v})).sort((a,b)=>b.count-a.count).slice(0,20);

  [{id:'m-bsvg',W:132,H:220},{id:'d-bsvg',W:300,H:300}].forEach(({id,W,H})=>{
    const svg=document.getElementById(id);
    svg.innerHTML='';
    if(!brands.length){svg.setAttribute('viewBox',`0 0 ${W} ${H}`);return;}

    const mx=brands[0].count;
    const PAD=4;

    // Step1: calculate radius for each brand
    const nodes=brands.map(b=>({
      ...b,
      r: Math.round(14+(b.count/mx)*(Math.min(W,H)*.18)),
      x:0, y:0
    }));

    // Step2: deterministic spiral placement — guarantees no overlap
    function overlaps(nx,ny,nr,placed){
      return placed.some(p=>Math.hypot(p.x-nx,p.y-ny)<p.r+nr+PAD);
    }
    function tryPlace(nr, placed){
      // Try spiral outward from centre
      const cx=W/2, cy=H/2;
      const maxR=Math.max(W,H);
      for(let dist=0;dist<maxR;dist+=2){
        const steps=Math.max(1,Math.round(2*Math.PI*dist/3));
        for(let i=0;i<steps;i++){
          const angle=(2*Math.PI*i/steps);
          const nx=cx+dist*Math.cos(angle);
          const ny=cy+dist*Math.sin(angle);
          if(nx-nr<PAD||nx+nr>W-PAD||ny-nr<PAD||ny+nr>H-PAD) continue;
          if(!overlaps(nx,ny,nr,placed)) return {x:nx,y:ny};
        }
      }
      return null; // fallback: couldn't place
    }

    const placed=[];
    nodes.forEach(n=>{
      const pos=tryPlace(n.r,placed);
      if(pos){n.x=pos.x;n.y=pos.y;placed.push(n);}
    });

    // Step3: compute actual bounding box and scale to fit SVG
    if(!placed.length){svg.setAttribute('viewBox',`0 0 ${W} ${H}`);return;}
    const minX=Math.min(...placed.map(p=>p.x-p.r));
    const maxX=Math.max(...placed.map(p=>p.x+p.r));
    const minY=Math.min(...placed.map(p=>p.y-p.r));
    const maxY=Math.max(...placed.map(p=>p.y+p.r));
    const vw=maxX-minX+PAD*2, vh=maxY-minY+PAD*2;
    svg.setAttribute('viewBox',`${minX-PAD} ${minY-PAD} ${vw} ${vh}`);
    svg.style.width='100%';
    svg.style.height='auto';
    svg.setAttribute('preserveAspectRatio','xMidYMid meet');

    // Step4: draw
    placed.forEach(b=>{
      const {x,y,r,color,name,count}=b;
      const g=document.createElementNS('http://www.w3.org/2000/svg','g');

      // Shadow
      const shadow=document.createElementNS('http://www.w3.org/2000/svg','circle');
      shadow.setAttribute('cx',x+2);shadow.setAttribute('cy',y+3);shadow.setAttribute('r',r);
      shadow.setAttribute('fill','rgba(0,0,0,0.25)');
      g.appendChild(shadow);

      // Circle
      const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
      c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);
      c.setAttribute('fill',color);c.setAttribute('opacity','.92');
      g.appendChild(c);

      // Inner highlight ring
      const ring=document.createElementNS('http://www.w3.org/2000/svg','circle');
      ring.setAttribute('cx',x);ring.setAttribute('cy',y);ring.setAttribute('r',r-2);
      ring.setAttribute('fill','none');ring.setAttribute('stroke','rgba(255,255,255,0.2)');ring.setAttribute('stroke-width','1.5');
      g.appendChild(ring);

      const fs=Math.max(9,Math.min(15,r*0.40));
      const hasCount=count>1;
      const nameY=hasCount ? y-fs*0.55 : y+fs*0.1;

      // Brand name
      const t1=document.createElementNS('http://www.w3.org/2000/svg','text');
      t1.setAttribute('x',x);t1.setAttribute('y',nameY);
      t1.setAttribute('text-anchor','middle');t1.setAttribute('dominant-baseline','middle');
      t1.setAttribute('fill','#fff');t1.setAttribute('font-size',fs);t1.setAttribute('font-weight','700');
      t1.setAttribute('font-family','Noto Sans TC,sans-serif');
      t1.setAttribute('letter-spacing','0.5');
      t1.textContent=name.slice(0,5);
      g.appendChild(t1);

      // Count badge
      if(hasCount){
        const badgeY=y+fs*0.85;
        const bw=count.toString().length*fs*0.5+18;
        const badge=document.createElementNS('http://www.w3.org/2000/svg','rect');
        badge.setAttribute('x',x-bw/2);badge.setAttribute('y',badgeY-fs*0.5);
        badge.setAttribute('width',bw);badge.setAttribute('height',fs*1);
        badge.setAttribute('rx',fs*0.5);badge.setAttribute('fill','rgba(0,0,0,0.35)');
        g.appendChild(badge);

        const t2=document.createElementNS('http://www.w3.org/2000/svg','text');
        t2.setAttribute('x',x);t2.setAttribute('y',badgeY);
        t2.setAttribute('text-anchor','middle');t2.setAttribute('dominant-baseline','middle');
        t2.setAttribute('fill','rgba(255,255,255,0.95)');t2.setAttribute('font-size',Math.max(8,fs*0.7));
        t2.setAttribute('font-family','Noto Sans TC,sans-serif');t2.setAttribute('font-weight','600');
        t2.textContent=count+'間';
        g.appendChild(t2);
      }
      svg.appendChild(g);
    });
  });
}

/* ── DETAIL SHEET ── */
function openDetail(p){
  curPlace=p; menuOpen=false; orderOpen=false;
  document.getElementById('sh-menu').style.display='none';
  document.getElementById('sh-order').style.display='none';
  gSvc().getDetails({placeId:p.place_id,fields:['name','formatted_address','formatted_phone_number','opening_hours','rating','user_ratings_total']},(d,st)=>{
    const info=st==='OK'?d:p;
    document.getElementById('sh-name').textContent=info.name||p.name;
    document.getElementById('sh-addr').textContent=info.formatted_address||p.vicinity||'';
    let meta='';
    if(info.rating) meta+=`<span class="mb mb-r">⭐ ${info.rating} (${info.user_ratings_total||0}則)</span>`;
    const io=info.opening_hours?.isOpen?.()??p.opening_hours?.isOpen?.();
    if(io===true) meta+=`<span class="mb mb-o">🟢 營業中</span>`;
    else if(io===false) meta+=`<span class="mb mb-c">🔴 休息中</span>`;
    if(info.formatted_phone_number) meta+=`<span class="mb mb-p" onclick="window.location='tel:${info.formatted_phone_number}'">${info.formatted_phone_number}</span>`;
    document.getElementById('sh-meta').innerHTML=meta;
    const days=['週日','週一','週二','週三','週四','週五','週六'];
    const today=new Date().getDay();
    const hrs=info.opening_hours?.weekday_text;
    document.getElementById('sh-hrs').innerHTML=hrs?.length
      ?hrs.map((h,i)=>{const di=(i+1)%7;const t=h.replace(/^[^:]+:\s*/,'');return`<div class="hr ${di===today?'hr-t':''}">${days[di]}<span>${t}</span></div>`;}).join('')
      :'<p style="color:var(--text2);font-size:12px">無營業時間資訊</p>';
    document.getElementById('btn-nav').onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(info.name||p.name)}&destination_place_id=${p.place_id}`,'_blank');
  });
  initOrder();
  loadMenuImages(p.name);
  document.getElementById('detail-overlay').classList.add('open');
}

/* ── MENU IMAGES (auto-load on openDetail) ── */
async function loadMenuImages(name){
  const box = document.getElementById('sh-menu-imgs');
  box.innerHTML = '<p style="color:var(--text2);font-size:12px">🔍 搜尋菜單圖片中…</p>';

  // Use Anthropic API to get top 3 most likely menu image search URLs via Google Images redirect
  try {
    const query = encodeURIComponent(name + ' 菜單 menu 2024');
    // Build 3 Google image search links as fallback display
    const searches = [
      { label: name + ' 菜單', q: name + ' 菜單 menu' },
      { label: name + ' 飲料 menu', q: name + ' 飲品 menu 點餐' },
    ];

    // Try to fetch images via Anthropic AI with web_search
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-20250514', max_tokens:600,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:`搜尋台灣飲料店「${name}」的菜單圖片網址，回傳最多3張直接可用的圖片URL（.jpg/.png/.webp結尾）。只回傳JSON：{"images":[{"url":"圖片直接網址","caption":"說明"}]}`}]
      })
    });
    const data = await res.json();
    const txt = (data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    const clean = txt.replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(clean);
    const imgs = parsed.images?.filter(i=>i.url&&/https?:\/\/.+\.(jpg|jpeg|png|webp)/i.test(i.url));

    if(imgs && imgs.length > 0){
      box.innerHTML = imgs.map(i=>
        `<div>
          <img src="${i.url}" alt="${i.caption||name+'菜單'}" 
            onerror="this.parentElement.style.display='none'"
            loading="lazy">
          <div class="menu-img-label">${i.caption||''}</div>
        </div>`
      ).join('');
      return;
    }
  } catch(e){ console.warn('Menu image AI error:', e); }

  // Fallback: show Google search link
  const q = encodeURIComponent(name + ' 菜單 menu');
  box.innerHTML = `
    <div style="text-align:center;padding:12px 0;">
      <p style="color:var(--text2);font-size:12px;margin-bottom:12px">自動載入失敗，請點下方搜尋</p>
      <a href="https://www.google.com/search?q=${q}&tbm=isch" target="_blank"
        style="background:var(--accent);color:#000;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:700;text-decoration:none;display:inline-block">
        🔍 Google 搜尋「${name}菜單」
      </a>
    </div>`;
}

/* ── SMART SEARCH with Places Autocomplete ── */
let acService = null;

function getAcService(){
  if(!acService) acService = new google.maps.places.AutocompleteService();
  return acService;
}

function addrSearch(q, callback){
  if(!q.trim()) return;
  // Use Places findPlaceFromQuery for smart name/address lookup
  const svc = IS_MOB ? mSvc : dSvc;
  svc.findPlaceFromQuery({
    query: q,
    fields: ['geometry','name','formatted_address']
  },(results, status)=>{
    if(status === google.maps.places.PlacesServiceStatus.OK && results?.[0]){
      const loc = results[0].geometry.location;
      searchCenter = loc;
      searchFrom(loc);
      if(callback) callback();
    } else {
      // Fallback to geocoder
      new google.maps.Geocoder().geocode({address: q+' 台灣', region:'TW'},(r,s)=>{
        if(s==='OK'&&r[0]){
          searchCenter = r[0].geometry.location;
          searchFrom(searchCenter);
          if(callback) callback();
        } else {
          showErr('找不到「'+q+'」，請試試更完整的地址或地點名稱');
        }
      });
    }
  });
}

// Autocomplete suggestions
let acTimer = null;
function setupAutocomplete(inputId, sugId){
  const input = document.getElementById(inputId);
  const sug = document.getElementById(sugId);
  if(!input || !sug) return;

  input.addEventListener('input', ()=>{
    const val = input.value.trim();
    // Show clear button (mobile)
    const clr = document.getElementById('m-clear');
    if(clr) clr.style.display = val ? 'block' : 'none';

    clearTimeout(acTimer);
    if(!val){ sug.style.display='none'; return; }

    acTimer = setTimeout(()=>{
      getAcService().getPlacePredictions({
        input: val,
        componentRestrictions: { country: 'tw' },
        types: ['geocode','establishment'],
        language: 'zh-TW'
      },(predictions, status)=>{
        if(status !== google.maps.places.PlacesServiceStatus.OK || !predictions){
          sug.style.display='none'; return;
        }
        sug.innerHTML = predictions.slice(0,5).map(p=>`
          <div class="m-sug-item" onclick="pickSuggestion('${inputId}','${sugId}',${JSON.stringify(p.description).replace(/'/g,"&#39;")})">
            <span class="m-sug-icon">📍</span>
            <span>${p.description}</span>
          </div>`).join('');
        sug.style.display = 'block';
      });
    }, 250);
  });

  input.addEventListener('keypress', e=>{
    if(e.key==='Enter'){ sug.style.display='none'; addrSearch(input.value); }
  });

  // Close suggestions when clicking outside
  document.addEventListener('click', e=>{
    if(!input.contains(e.target) && !sug.contains(e.target)) sug.style.display='none';
  });
}

function pickSuggestion(inputId, sugId, description){
  document.getElementById(inputId).value = description;
  document.getElementById(sugId).style.display = 'none';
  addrSearch(description);
}

// Init autocomplete after map loads
function initAutocomplete(){
  setupAutocomplete('m-si','m-suggestions');
  setupAutocomplete('d-si','d-suggestions');
}

/* ── ERROR TOAST ── */
function showErr(msg){
  const el=document.createElement('div');
  el.style.cssText='position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#c0392b;color:#fff;padding:14px 20px;border-radius:12px;font-size:13px;z-index:9999;max-width:90vw;text-align:center;font-family:Noto Sans TC,sans-serif;white-space:pre-line;box-shadow:0 4px 20px rgba(0,0,0,.4);line-height:1.5;';
  el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),9000);
}
